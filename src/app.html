<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#7fd8ff" />
		<meta name="description" content="Dunia Pintar 3D — petualangan belajar 3D untuk anak 3–5 tahun berbahasa Indonesia: berhitung, huruf, membaca, warna dan hewan. Tanpa tekanan, tanpa kalah." />
		<meta name="robots" content="index, follow" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Social sharing (Open Graph + Twitter). og:image must be absolute,
		     so it is resolved at request time in +layout.server.ts instead. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Dunia Pintar 3D" />
		<meta property="og:title" content="Dunia Pintar 3D — Belajar sambil bermain, untuk anak 3–5 tahun" />
		<meta property="og:description" content="Petualangan 3D berbahasa Indonesia: berhitung, huruf, membaca, warna dan hewan. Ramah anak, tanpa tekanan." />
		<meta property="og:locale" content="id_ID" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Dunia Pintar 3D — Belajar sambil bermain" />
		<meta name="twitter:description" content="Petualangan 3D berbahasa Indonesia untuk anak 3–5 tahun." />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: block !important">%sveltekit.body%</div>
	</body>
</html>
